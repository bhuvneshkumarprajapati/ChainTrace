
services:
  frontend:
    image: chaintrace-frontend
    container_name: chaintrace-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: chaintrace-frontend-prod
    container_name: chaintrace-frontend-prod
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: chaintrace-backend
    container_name: chaintrace-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: "5000"
      BLOCKCHAIN_RPC_URL: ${SEPOLIA_RPC_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
