
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: chaintrace-frontend
    container_name: chaintrace-frontend
    environment:
      API_PROXY_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: chaintrace-frontend-prod
    container_name: chaintrace-frontend-prod
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: chaintrace-backend
    container_name: chaintrace-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: "5000"
      BLOCKCHAIN_RPC_URL: ${SEPOLIA_RPC_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
