
name: ChainTrace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Run backend tests
        run: npm test
        working-directory: server

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker Image Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI-only environment file
        shell: bash
        run: |
          touch server/.env
          echo "SEPOLIA_RPC_URL=https://example.invalid" >> "$GITHUB_ENV"

      - name: Validate Docker Compose
        env:
          SEPOLIA_RPC_URL: ${{ env.SEPOLIA_RPC_URL }}
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -t chaintrace-backend:ci ./server

      - name: Build production frontend image
        run: docker build -t chaintrace-frontend:ci -f Dockerfile.prod .
